[project]
name = "vpn-panel"
version = "0.1.0"
description = "Self-hosted VPN control panel (Xray VLESS+REALITY)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "aiosqlite>=0.22,<1",
  "alembic>=1.20,<2",
  "asyncssh>=2.24,<3",
  "cryptography>=50,<51",
  "argon2-cffi>=25.1,<26",
  "sse-starlette>=3.7,<4",
  "apscheduler>=3.11,<4",
  "httpx>=0.28,<1",
  "segno>=1.6,<2",
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.17", "mypy>=2.4"]
postgres = ["asyncpg>=0.32,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
